<svg width="900" height="550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1B3B5F; }
      .circle-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1B3B5F; }
      .item-text { font-family: Arial, sans-serif; font-size: 13px; fill: #1B3B5F; }
      .overlap-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1B3B5F; }
    </style>
    <linearGradient id="fdeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F39C6B;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#F39C6B;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="productGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A78EC3;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#A78EC3;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="overlapGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F39C6B;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#4DB8C4;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#A78EC3;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="35" class="title" text-anchor="middle">Ownership Boundaries: FDE and Product Teams</text>

  <!-- Left Circle: FDE Team Owns -->
  <ellipse cx="300" cy="300" rx="220" ry="180" fill="url(#fdeGradient)" stroke="#F39C6B" stroke-width="3"/>

  <!-- Right Circle: Product Team Owns -->
  <ellipse cx="600" cy="300" rx="220" ry="180" fill="url(#productGradient)" stroke="#A78EC3" stroke-width="3"/>

  <!-- Overlap Area -->
  <path d="M 450 120 Q 450 200 450 300 Q 450 400 450 480" fill="url(#overlapGradient)" opacity="0.8"/>

  <!-- FDE Team Content -->
  <text x="220" y="180" class="circle-title">FDE Team Owns</text>
  <text x="140" y="210" class="item-text">✓ Client outcomes</text>
  <text x="140" y="235" class="item-text">✓ Client-specific config</text>
  <text x="140" y="260" class="item-text">✓ Demo building</text>
  <text x="140" y="285" class="item-text">✓ Field feedback</text>
  <text x="140" y="310" class="item-text">✓ Production deployment</text>

  <!-- Product Team Content -->
  <text x="620" y="180" class="circle-title">Product Team Owns</text>
  <text x="620" y="210" class="item-text">✓ Core functionality</text>
  <text x="620" y="235" class="item-text">✓ Technical docs</text>
  <text x="620" y="260" class="item-text">✓ Dev environment</text>
  <text x="620" y="285" class="item-text">✓ Bug fixes</text>
  <text x="620" y="310" class="item-text">✓ Roadmap</text>

  <!-- Shared Ownership Content -->
  <text x="450" y="220" class="overlap-title" text-anchor="middle">Shared</text>
  <text x="450" y="240" class="overlap-title" text-anchor="middle">Ownership</text>

  <text x="450" y="270" class="item-text" text-anchor="middle">Early deployments</text>
  <text x="450" y="293" class="item-text" text-anchor="middle" style="font-size: 11px;">(Product leads first 1-2)</text>

  <text x="450" y="320" class="item-text" text-anchor="middle">Demo environments</text>
  <text x="450" y="343" class="item-text" text-anchor="middle" style="font-size: 11px;">(Product baseline, FDE extends)</text>

  <text x="450" y="370" class="item-text" text-anchor="middle">Feature requests</text>
  <text x="450" y="393" class="item-text" text-anchor="middle" style="font-size: 11px;">(FDE identifies, Product builds)</text>

  <text x="450" y="420" class="item-text" text-anchor="middle">Architecture decisions</text>
  <text x="450" y="443" class="item-text" text-anchor="middle" style="font-size: 11px;">(Product decides, FDE contributes)</text>

  <!-- Legend -->
  <rect x="50" y="500" width="800" height="35" rx="5" fill="#F5F7FA"/>
  <text x="60" y="520" style="font-family: Arial; font-size: 12px; fill: #666666;">
    💡 Clear boundaries prevent friction. When in doubt: FDEs own client outcomes, Product owns platform.
  </text>
</svg>
